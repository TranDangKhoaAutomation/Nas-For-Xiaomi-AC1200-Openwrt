name: Build dm-zero for OpenWrt 25.12.6 MT7621

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-dm-zero.yml
      - scripts/kernel/dm-zero/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact official SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk='openwrt-sdk-25.12.6-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$sdk" "https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/$sdk"
          printf '%s  %s\n' 'e4e3f25962ddf3ed55207fed456ecd1d6e55f3482c976b3183a640df6ef0adf0' "$RUNNER_TEMP/$sdk" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/$sdk" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/${sdk%.tar.zst}" > "$RUNNER_TEMP/sdk-path"
      - name: Add pinned upstream Linux dm-zero source
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(cat "$RUNNER_TEMP/sdk-path")"
          mkdir -p "$sdk/package/dm-zero/src"
          cp scripts/kernel/dm-zero/Makefile "$sdk/package/dm-zero/Makefile"
          cp scripts/kernel/dm-zero/src/Makefile "$sdk/package/dm-zero/src/Makefile"
          cp scripts/kernel/dm-zero/src/dm-zero.c "$sdk/package/dm-zero/src/dm-zero.c"
          printf '%s  %s\n' 'a9b63a5bd78eeeeb76651477bb234b819c2c573e9acbabcc61bda3bf55a04054' "$sdk/package/dm-zero/src/dm-zero.c" | sha256sum --check
      - name: Compile only the external kernel module
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(cat "$RUNNER_TEMP/sdk-path")"
          cd "$sdk"
          printf '\nCONFIG_PACKAGE_kmod-dm-zero=m\n' >> .config
          make defconfig
          make package/dm-zero/compile -j2 V=s
          find build_dir -name dm-zero.ko -type f -print
          find bin -name 'kmod-dm-zero*.apk' -type f -print
      - name: Save module and build information
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(cat "$RUNNER_TEMP/sdk-path")"
          mkdir -p "$RUNNER_TEMP/dm-zero-output"
          ko="$(find "$sdk/build_dir" -name dm-zero.ko -type f -print -quit)"
          test -n "$ko"
          cp "$ko" "$RUNNER_TEMP/dm-zero-output/dm-zero.ko"
          find "$sdk/bin" -name 'kmod-dm-zero*.apk' -type f -exec cp '{}' "$RUNNER_TEMP/dm-zero-output/" ';'
          file "$ko" > "$RUNNER_TEMP/dm-zero-output/build-info.txt"
          sha256sum "$ko" >> "$RUNNER_TEMP/dm-zero-output/build-info.txt"
          if command -v modinfo >/dev/null; then modinfo -F vermagic "$ko" >> "$RUNNER_TEMP/dm-zero-output/build-info.txt"; fi
          cat "$RUNNER_TEMP/dm-zero-output/build-info.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dm-zero-openwrt-25.12.6-mt7621
          path: ${{ runner.temp }}/dm-zero-output/
